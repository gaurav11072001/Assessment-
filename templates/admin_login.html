{% extends "base.html" %}

{% block title %}Admin Login | ExamPortal{% endblock %}

{% block content %}
<section class="admin-wrap">
    <div class="admin-login-card">
        <div class="admin-lock">&#128274;</div>
        <h1>Admin Console</h1>
        <p class="admin-sub">Authorised personnel only. Results are visible to administrators exclusively.</p>

        {% if error %}
        <div class="reg-error">{{ error }}</div>
        {% endif %}

        <form method="POST" class="reg-form" autocomplete="off">
            <label class="field">
                <span class="field-label">Username</span>
                <input type="text" name="username" placeholder="admin" required>
            </label>

            <label class="field">
                <span class="field-label">Password</span>
                <input type="password" name="password" placeholder="••••••••" required>
            </label>

            <button type="submit" class="btn-submit btn-block">Sign In</button>
        </form>

        <div class="reg-switch">
            <a href="{{ url_for('index') }}">&larr; Back to ExamPortal</a>
        </div>
    </div>
</section>

<style>
.admin-wrap { max-width: 440px; margin: 0 auto; padding: 1rem 0 2rem; }

.admin-login-card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 2.25rem 1.75rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    text-align: center;
}

.admin-lock { font-size: 2.5rem; margin-bottom: 0.75rem; }

.admin-login-card h1 { font-size: 1.7rem; color: #2c3e50; margin-bottom: 0.4rem; }
.admin-sub { color: #64748b; font-size: 0.88rem; margin-bottom: 1.5rem; }

.reg-error {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    padding: 0.7rem 1rem;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 1rem;
    text-align: left;
}

.reg-form { display: flex; flex-direction: column; gap: 1rem; text-align: left; }
.field { display: flex; flex-direction: column; gap: 0.35rem; }

.field-label {
    font-size: 0.8rem;
    font-weight: 700;
    color: #2c3e50;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.field input {
    padding: 0.8rem 1rem;
    border: 2px solid #e2e8f0;
    border-radius: 10px;
    font-size: 1rem;
    font-family: inherit;
    color: #1a202c;
    background: #fff;
    width: 100%;
    transition: border-color 0.2s;
}

.field input:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
}

.btn-block { width: 100%; margin-top: 0.5rem; text-align: center; }

.reg-switch {
    margin-top: 1.5rem;
    text-align: center;
    font-size: 0.88rem;
}

.reg-switch a { color: #2563eb; font-weight: 700; text-decoration: none; }
.reg-switch a:hover { text-decoration: underline; }
</style>
{% endblock %}

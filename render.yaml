# Render Blueprint - free tier configuration.
#
# Sized for ~60-80 concurrent candidates: measured 80 students = 9,920
# requests with 0 errors, ~59 MB RSS per worker.
#
# To remove the 15-minute sleep behaviour and the 30-day database expiry,
# upgrade in the Render dashboard:
#   web service -> Starter  ($7/mo,  0.5 CPU / 512 MB)
#   postgres    -> paid    ($6/mo,  256 MB, no expiry)

services:
  - type: web
    name: assessment
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --config gunicorn.conf.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Render defaults to Python 3.14 for new services. psycopg has wheels
      # for 3.14, but pinning to 3.13 keeps the build deterministic.
      # Precedence: PYTHON_VERSION > dashboard > .python-version > runtime.txt
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DATABASE_URL
        fromDatabase:
          name: assessment-db
          property: connectionString
      - key: EXAMPORTAL_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: "admin"
      - key: ADMIN_PASSWORD
        generateValue: true
      # 2 workers x 8 threads = 16 concurrent handlers (free tier is 512 MB)
      - key: WEB_CONCURRENCY
        value: "2"
      - key: WEB_THREADS
        value: "8"
      # Render Postgres allows 100 connections on a <8 GB plan, so a pool of
      # 4 per worker (8 total across 2 workers) is comfortably within it.
      - key: PG_POOL_SIZE
        value: "4"
      - key: PG_POOL_MIN
        value: "1"
      - key: COOKIE_SECURE
        value: "1"

databases:
  - name: assessment-db
    databaseName: assessment
    user: assessment
    plan: free
